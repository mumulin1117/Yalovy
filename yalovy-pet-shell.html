<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Yalovy</title>
    <script defer src="./yalovycheukids/yalovy-first-step.js"></script>
    <script defer src="./yalovycheukids/yalovy-pet-journal-core.js"></script>
    <script defer src="./yalovycheukids/yalovy-entry-polish.js"></script>
    <link rel="stylesheet" href="./yalovycheukids/yalovy-first-step.css">
    <link rel="stylesheet" href="./yalovycheukids/yalovy-pet-journal.css">
    <link rel="stylesheet" href="./yalovycheukids/yalovy-entry-polish.css">
  </head>
  <body>
    <div id="app">
      <div id="native-browser-fallback" role="status" aria-atomic="true">
        <div class="native-browser-fallback__logo">Y</div>
        <div class="native-browser-fallback__title">YALOVY</div>
        <div class="native-browser-fallback__text">Loading your pet moments…</div>
      </div>
    </div>
    <style>
      #native-browser-fallback {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        background: radial-gradient(120% 70% at 50% 34%, #2a3410, #141414 70%);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .native-browser-fallback__logo {
        display: flex;
        width: 72px;
        height: 72px;
        align-items: center;
        justify-content: center;
        border-radius: 20px;
        background: linear-gradient(145deg, #dfff45, #21d9c0);
        color: #17191a;
        font-size: 38px;
        font-weight: 900;
      }
      .native-browser-fallback__title { font-size: 26px; font-weight: 900; letter-spacing: 1px; }
      .native-browser-fallback__text { color: #9aa694; font-size: 14px; font-weight: 600; }
    </style>
  </body>
</html>
